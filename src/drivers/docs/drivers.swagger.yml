tags:
  - name: Drivers
    description: API for managing drivers

paths:
  /api/drivers:
    get:
      summary: Get a list of all drivers
      tags: [Drivers]
      security:
        - BasicAuth: []
      responses:
        200:
          description: List of all drivers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Driver'
    post:
      summary: Add a new driver
      tags: [Drivers]
      security:
        - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverInputDto'
      responses:
        201:
          description: The driver was successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /api/drivers/{id}:
    get:
      summary: Get a driver by ID
      tags: [Drivers]
      security:
        - BasicAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: 'The unique identifier of the driver'
          schema:
            type: integer
            example: 2
      responses:
        200:
          description: The requested driver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        404:
          description: Driver not found
    put:
      summary: Update a driver by ID
      tags: [Drivers]
      security:
        - BasicAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: 'The unique identifier of the driver'
          schema:
            type: integer
            example: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverInputDto'
      responses:
        204:
          description: Driver updated successfully
        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        404:
          description: Driver not found
    delete:
      summary: Delete a driver by ID
      tags: [Drivers]
      security:
        - BasicAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: 'The unique identifier of the driver'
          schema:
            type: integer
            example: 2
      responses:
        204:
          description: Driver deleted successfully
        404:
          description: Driver not found

components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
  schemas:
    Driver:
      type: object
      required:
        - id
        - name
        - phoneNumber
        - email
        - vehicleMake
        - vehicleModel
        - vehicleYear
        - vehicleLicensePlate
        - vehicleFeatures
        - createdAt
      properties:
        id:
          type: integer
          example: 2
        name:
          type: string
          example: 'Tom Rider'
        phoneNumber:
          type: string
          example: '123-456-7890'
        email:
          type: string
          example: 'tom.rider@example.com'
        vehicleMake:
          type: string
          example: 'Toyota'
        vehicleModel:
          type: string
          example: 'Camry'
        vehicleYear:
          type: integer
          example: 2020
        vehicleLicensePlate:
          type: string
          example: 'XYZ 1234'
        vehicleDescription:
          type: string
          nullable: true
          example: 'A spacious SUV with leather seats and a sunroof'
        vehicleFeatures:
          type: array
          items:
            type: string
            enum: [wi-fi, child-seat, pet-friendly]
          example: ['wi-fi', 'pet-friendly']
        createdAt:
          type: string
          format: date-time
          example: '2023-03-05T12:00:00Z'
    DriverInputDto:
      type: object
      required:
        - name
        - phoneNumber
        - email
        - vehicleMake
        - vehicleModel
        - vehicleYear
        - vehicleLicensePlate
        - vehicleFeatures
      properties:
        name:
          type: string
          example: 'Tom Rider'
        phoneNumber:
          type: string
          example: '123-456-7890'
        email:
          type: string
          example: 'tom.rider@example.com'
        vehicleMake:
          type: string
          example: 'Toyota'
        vehicleModel:
          type: string
          example: 'Camry'
        vehicleYear:
          type: integer
          example: 2025
        vehicleLicensePlate:
          type: string
          example: 'XYZ 1234'
        vehicleDescription:
          type: string
          nullable: true
          example: 'A spacious SUV with leather seats and a sunroof'
        vehicleFeatures:
          type: array
          items:
            type: string
            enum: [wi-fi, child-seat, pet-friendly]
          example: ['wi-fi', 'pet-friendly']
    ValidationError:
      type: object
      properties:
        field:
          type: string
          example: 'name'
        message:
          type: string
          example: 'Invalid name'
    ValidationErrorResponse:
      type: object
      properties:
        errorMessages:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
