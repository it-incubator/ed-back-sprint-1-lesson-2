tags:
  - name: Rides
    description: API for managing rides

paths:
  /api/rides:
    get:
      summary: Get a list of all rides
      tags: [Rides]
      security:
        - BasicAuth: []
      responses:
        200:
          description: List of all rides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ride'
    post:
      summary: Create a new ride
      tags: [Rides]
      security:
        - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideInputDto'
      responses:
        201:
          description: Ride successfully created for an existing driver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
        400:
          description: Validation error or the driver does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /api/rides/{id}:
    get:
      summary: Get a ride by ID
      tags: [Rides]
      security:
        - BasicAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: The unique identifier of the ride
          schema:
            type: integer
            example: 5
      responses:
        200:
          description: The requested ride
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
        404:
          description: Ride not found

components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
  schemas:
    Ride:
      type: object
      required:
        - id
        - clientName
        - driverId
        - driverName
        - vehicleLicensePlate
        - vehicleName
        - price
        - currency
        - createdAt
      properties:
        id:
          type: integer
          example: 5
        clientName:
          type: string
          example: 'Alice Johnson'
        driverId:
          type: integer
          example: 2
        driverName:
          type: string
          example: 'Tom Rider'
        vehicleLicensePlate:
          type: string
          example: 'XYZ 1234'
        vehicleName:
          type: string
          example: 'Toyota Camry'
        price:
          type: number
          format: float
          example: 15.75
        currency:
          type: string
          enum: [usd, eur]
          example: 'usd'
        createdAt:
          type: string
          format: date-time
          example: '2023-03-01T14:30:00Z'
        updatedAt:
          type: string
          format: date-time
          nullable: true
          example: null
        addresses:
          type: object
          properties:
            from:
              type: string
              example: '123 Main St, Cityville'
            to:
              type: string
              example: '456 Elm St, Townsville'
    RideInputDto:
      type: object
      required:
        - clientName
        - price
        - currency
        - driverId
        - fromAddress
        - toAddress
      properties:
        clientName:
          type: string
          example: 'Alice Johnson'
        price:
          type: number
          format: float
          example: 15.75
        currency:
          type: string
          enum: [usd, eur]
          example: 'usd'
        driverId:
          type: integer
          example: 2
        fromAddress:
          type: string
          example: '123 Main St, Cityville'
        toAddress:
          type: string
          example: '456 Elm St, Townsville'
    ValidationError:
      type: object
      properties:
        field:
          type: string
          example: 'clientName'
        message:
          type: string
          example: 'Client name is required'
    ValidationErrorResponse:
      type: object
      properties:
        errorMessages:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
